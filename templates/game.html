{% extends 'base.html' %}{% block content %}<section class="game-shell"><div><div id="board" class="board" data-game="{{ game.id }}"></div></div><aside class="panel game-info"><span class="eyebrow">ПАРТИЯ #{{ game.id }}</span><h2>{{ 'Против бота: ' + game.bot_level if game.mode == 'bot' else 'Онлайн-партия' }}</h2><p id="status">Загрузка позиции…</p><p class="muted">Нажмите фигуру, затем клетку назначения. Рокировка и превращение пешки поддерживаются.</p><a class="button ghost" href="/dashboard">Сохранить и выйти</a></aside></section><script src="{{ url_for('static', filename='js/game.js') }}"></script>{% endblock %}
